<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>산사 (Sansa View) — 청연당 · 淸緣堂</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 초기 로딩 화면 -->
    <div id="sansa-loading" class="sansa-loading" role="status" aria-live="polite">
      <svg class="loading-lotus" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M32 10C26 22 24 34 32 46C40 34 38 22 32 10Z" />
        <path d="M32 46C20 42 13 30 16 18C24 22 28 32 32 46Z" />
        <path d="M32 46C44 42 51 30 48 18C40 22 36 32 32 46Z" />
        <path d="M12 48C22 53 42 53 52 48" />
      </svg>
      <h1 class="loading-title">산사 · 淸緣堂</h1>
      <p id="sansa-loading-status" class="loading-status">산사의 고요한 풍경을 불러오고 있습니다...</p>
    </div>

    <!-- 상단 HUD (공간 이름표 & 빠른 공간 이동 · 시점 · 낮/밤 · 사운드 제어) -->
    <header class="sansa-hud-top">
      <div class="hud-brand-card" data-liquid-glass>
        <div class="hud-brand-row">
          <h1 id="hud-space-title" class="hud-space-title">마당 · 연등 산책길</h1>
          <span id="hud-visitor-count" class="hud-visitor-badge">5명 참배 중</span>
        </div>
        <p id="hud-space-sub" class="hud-space-sub">연꽃 연못과 소나무 숲이 이어지는 도량</p>
      </div>

      <div class="hud-top-controls" role="toolbar" aria-label="산사 공간 및 환경 설정">
        <select id="select-location" class="hud-select" aria-label="빠른 공간 이동">
          <option value="entryGate">위치: 산사 일주문 입구</option>
          <option value="courtyard">위치: 청연당 앞마당</option>
          <option value="lotusPond">위치: 연꽃 연못 구름다리</option>
          <option value="hallCenter">위치: 청연당 법당 중앙</option>
          <option value="incenseFront">위치: 향로 앞 참배석</option>
        </select>

        <button type="button" id="btn-triad-view" class="hud-pill-btn" data-liquid-glass aria-label="삼존불 참배 시점 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z" />
          </svg>
          <span class="hud-btn-label">3인칭 시점</span>
        </button>

        <button type="button" id="btn-light" class="hud-pill-btn" data-liquid-glass aria-pressed="false" aria-label="낮과 밤 조명 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2m-7.07-14.93 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2m-14.93 7.07 1.41-1.41m11.32-11.32 1.41-1.41" />
          </svg>
          <span class="hud-btn-label">낮 (주간)</span>
        </button>

        <button type="button" id="btn-audio" class="hud-pill-btn" data-liquid-glass aria-pressed="false" aria-label="소리 켜기 및 끄기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5Z" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <span class="hud-btn-label">소리 켜기</span>
        </button>
      </div>
    </header>

    <!-- 3D 산사 메인 뷰포트 (청연당 · 연등 산책길 · 연꽃 연못) -->
    <main id="sansa-viewport"></main>

    <!-- 하단 수행 액션 바 -->
    <footer class="sansa-hud-bottom">
      <div class="action-dock" data-liquid-glass role="group" aria-label="산사 수행 동작">
        <button type="button" id="btn-greet" class="action-btn" aria-label="합장 인사">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3c-1.5 4-4 7-4 11a4 4 0 0 0 8 0c0-4-2.5-7-4-11Z" />
            <path d="M12 18v3" />
          </svg>
          <span>합장 인사</span>
        </button>

        <button type="button" id="btn-bow" class="action-btn" aria-label="절하기 (배례)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="6" r="2.5" />
            <path d="M7 20c1.5-4 3-7 5-7s3.5 3 5 7" />
            <path d="M4 20h16" />
          </svg>
          <span>절하기 (배례)</span>
        </button>

        <button type="button" id="btn-beads" class="action-btn" aria-label="108 염주 돌리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="5" r="2" />
            <circle cx="17" cy="7" r="1.8" />
            <circle cx="19" cy="12" r="1.8" />
            <circle cx="17" cy="17" r="1.8" />
            <circle cx="12" cy="19" r="2" />
            <circle cx="7" cy="17" r="1.8" />
            <circle cx="5" cy="12" r="1.8" />
            <circle cx="7" cy="7" r="1.8" />
          </svg>
          <span>염주 (108)</span>
        </button>

        <button type="button" id="btn-moktak" class="action-btn" aria-label="목탁 두드리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 13a7 7 0 1 1 13.6 2.2L21 17l-1.5 2.5-3.8-1.5A7 7 0 0 1 4 13Z" />
            <path d="M5 14h8" />
            <circle cx="13" cy="14" r="1.4" />
          </svg>
          <span>목탁</span>
        </button>

        <button type="button" id="btn-seat" class="action-btn" aria-label="방석 자리 앉기 또는 일어서기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="14" width="16" height="5" rx="2.5" />
            <path d="M7 14v-3a5 5 0 0 1 10 0v3" />
          </svg>
          <span>자리 앉기</span>
        </button>
      </div>
      <p class="hud-guide-hint">바닥 클릭 또는 WASD·방향키로 이동 · 드래그로 시점 회전 · 향로 가까이 가면 [향 올리기]가 나타납니다</p>
    </footer>

    <!-- 토스트 알림 -->
    <div id="sansa-toast" class="sansa-toast" role="status" aria-live="polite" hidden></div>

    <!-- 복전함 안내 다이얼로그 -->
    <dialog id="support-dialog" class="sansa-dialog">
      <h2 class="dialog-title">청연당 복전함 (福田函)</h2>
      <p class="dialog-desc">
        청연당(淸緣堂)을 찾아주셔서 고맙습니다.<br />
        한 자루의 향과 고요한 합장만으로도 도량은 충분히 밝아집니다.<br />
        머무시는 동안 마음의 평안이 함께하기를 발원합니다.
      </p>
      <button type="button" id="btn-close-support" class="dialog-close-btn">마음만 보태기 (닫기)</button>
    </dialog>

    <!-- Three.js r180 + SANSA_CORE 런타임 엔진 및 클린 모듈러 애플리케이션 로드 -->
    <script src="./src/engine/sansa-runtime.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
